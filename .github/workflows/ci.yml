name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  brew-audit-and-test:
    runs-on: macos-14
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Tap from local checkout
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
          mkdir -p "$(dirname "${TAP_DIR}")"
          ln -s "${GITHUB_WORKSPACE}" "${TAP_DIR}"

      # Homebrew refuses to load formulae from a third-party tap unless the
      # tap or the formula is trusted. Trust the single formula this workflow
      # exercises rather than the whole tap, so a future formula added here
      # does not inherit trust implicitly.
      - name: Trust formula
        run: brew trust --formula jasnross/tap/agentspec

      - name: Audit formula
        run: brew audit --strict agentspec

      - name: Install formula
        run: brew install --build-from-source agentspec || brew install agentspec

      - name: Test formula
        run: brew test agentspec
